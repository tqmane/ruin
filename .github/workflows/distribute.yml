name: Build RUIN distribution

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  distribute:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select and validate version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == v* ]] || { echo "Release tags must start with v." >&2; exit 1; }
            ruin_version="${GITHUB_REF_NAME#v}"
          else
            ruin_version="$(cat VERSION)"
          fi
          python3 -c 'import sys; sys.path.insert(0, "tools"); from distribute import validate_version; validate_version(sys.argv[1])' "$ruin_version"
          echo "value=$ruin_version" >> "$GITHUB_OUTPUT"

      - name: Build arm64+arm64e universal dylib
        env:
          RUIN_VERSION: ${{ steps.version.outputs.value }}
        run: make -j4 all RUIN_BUILD_VERSION="$RUIN_VERSION"

      - name: Verify real arm64+arm64e dylib
        shell: bash
        run: |
          set -euo pipefail
          arches="$(lipo build/RUIN.dylib -archs)"
          python3 -c 'import sys; a=sys.argv[1].split(); e={"arm64", "arm64e"}; assert len(a)==2 and set(a)==e, a' "$arches"
          lipo build/RUIN.dylib -verify_arch arm64 arm64e
          codesign --verify --strict build/RUIN.dylib

      - name: Run existing macOS host fixtures
        run: make -j4 check-host

      - name: Run actual and synthetic packaging verification
        run: make check-packaging

      - name: Package and verify system dependencies
        env:
          RUIN_VERSION: ${{ steps.version.outputs.value }}
        run: make dist RUIN_BUILD_VERSION="$RUIN_VERSION"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruin-${{ steps.version.outputs.value }}
          path: |
            dist/RUIN-${{ steps.version.outputs.value }}-rootful.deb
            dist/RUIN-${{ steps.version.outputs.value }}-rootless.deb
            dist/RUIN-${{ steps.version.outputs.value }}-jailed.deb
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RUIN_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "RUIN $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "dist/RUIN-${RUIN_VERSION}-rootful.deb" \
            "dist/RUIN-${RUIN_VERSION}-rootless.deb" \
            "dist/RUIN-${RUIN_VERSION}-jailed.deb" \
            dist/SHA256SUMS \
            --clobber
